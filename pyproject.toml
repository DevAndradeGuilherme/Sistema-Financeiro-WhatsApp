[project]
name = "sistema-financeiro-whatsapp"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM"]
ignore = ["S101"]  # assert is the pytest idiom

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]
"config/settings/test.py" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "common", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "--strict-markers -p no:cacheprovider"
